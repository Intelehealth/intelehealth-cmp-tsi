name: Main

on:
  workflow_dispatch: {}
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check python_port

      # Tighten once the codebase is formatted.
      - name: Ruff format check
        run: ruff format --check python_port
        continue-on-error: true

  # M-02: software composition analysis. A known CVE in a pinned dependency
  # fails the build; so does compiled bytecode committed to the repository.
  supply-chain:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # M-02: audit the hash-pinned lockfile the image installs, not
      # whatever the >= ranges resolve to on the day.
      - name: Audit runtime dependencies
        run: pip-audit --strict --require-hashes -r python_port/requirements.lock

      # Every direct requirement must be pinned in the lockfile, so a new
      # dependency cannot reach the image unaudited.
      - name: Lockfile covers requirements.txt
        run: |
          python - <<'EOF'
          import re
          lock = {m.group(1).lower() for m in re.finditer(r"^([A-Za-z0-9_.-]+)==", open("python_port/requirements.lock").read(), re.M)}
          reqs = {re.split(r"[\[<>=;# ]", l.strip())[0].lower() for l in open("python_port/requirements.txt") if l.strip() and not l.startswith("#")}
          missing = sorted(reqs - lock)
          assert not missing, f"requirements.lock is stale; re-run pip-compile (python_port/README.md): {missing}"
          EOF

      # P13-05: the browser libraries in web/vendor/ are outside pip-audit.
      # Hashes must match the manifest, and any OSV advisory must be accepted
      # there with a reason and an unexpired review_by date.
      - name: Audit vendored web libraries
        run: python scripts/supply_chain/vendor_audit.py

      - name: No compiled bytecode in the repository
        run: |
          if git ls-files | grep -E '(\.py[co]$|__pycache__/)'; then
            echo "Compiled bytecode is committed; remove it (it is gitignored)."
            exit 1
          fi

  test:
    name: Import check + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password-0123456789abcdef
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: postgresql://localhost:5434
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWD: ci-password-0123456789abcdef
      JWT_SECRET: ci-jwt-0123456789abcdef0123456789abcdef
      DB_ENCRYPTION_KEY: ci-enc-0123456789abcdef0123456789abcdef
      TSI_LOOKUP_SALT: ci-salt-0123456789abcdef0123456789abcdef
      PII_LOOKUP_KEY: ci-lookup-0123456789abcdef0123456789abcdef
      BOOTSTRAP_TOKEN: ci-boot-0123456789abcdef0123456789abcdef
      TSI_DPDP_CMS_ENV: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python_port/requirements.txt
            python_port/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r python_port/requirements-dev.txt

      # Catches syntax errors and bad imports.
      - name: Byte-compile sources
        run: python -m compileall -q python_port/dpdpcms_py

      # Provision the schema from db/*.sql so the DB-backed tests in
      # tests/test_integration_db.py run against a live Postgres (the workbook's
      # root-cause fix: scoping/ordering defects must be visible to CI).
      - name: Provision test database
        env:
          PGHOST: localhost
          PGPORT: "5434"
          PGDATABASE: ci
          PGUSER: ci
          PGPASSWORD: ci-password-0123456789abcdef
        run: |
          for f in db/*.sql; do
            echo "applying $f"
            psql -q -v ON_ERROR_STOP=1 -f "$f"
          done

      # Import smoke test after the schema is ready.
      - name: Import smoke test
        working-directory: python_port
        run: python -c "import dpdpcms_py.main"

      # python -m pytest puts python_port/ on sys.path.
      # An empty suite fails (exit 5), never green.
      - name: Run pytest
        working-directory: python_port
        run: python -m pytest -q tests

      # M-01: the automated authenticated pen test drives the real HTTP stack
      # (two tenants, every credential type) and fails on any attack that works.
      - name: Automated pen test
        working-directory: python_port
        run: python -m pytest -q pentest --junitxml=pentest-report.xml

      - name: Upload pen-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pentest-report
          path: python_port/pentest-report.xml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: >-
          docker build -f python_port/Dockerfile
          -t tsi-dpdp-cms-python:ci .