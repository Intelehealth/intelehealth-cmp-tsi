name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check python_port

      - name: Ruff format check
        run: ruff format --check python_port
        continue-on-error: true # tighten once the codebase is formatted

  test:
    name: Import check + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_port/requirements.txt

      - name: Install dependencies
        run: pip install -r python_port/requirements.txt pytest

      # Catches syntax errors and bad imports even before a test suite exists.
      - name: Byte-compile sources
        run: python -m compileall -q python_port/dpdpcms_py

      - name: Import smoke test
        working-directory: python_port
        env:
          POSTGRES_HOST: postgresql://localhost:5434
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWD: ci-only-password-not-real-1234567890
          JWT_SECRET: ci-only-jwt-secret-not-real-1234567890abcd
          DB_ENCRYPTION_KEY: ci-only-enc-key-not-real-1234567890abcdef
          TSI_LOOKUP_SALT: ci-only-salt-not-real-1234567890abcdefgh
          TSI_DPDP_CMS_ENV: local
        run: python -c "import dpdpcms_py.main"

      - name: Run pytest (when a test suite exists)
        working-directory: python_port
        env:
          POSTGRES_HOST: postgresql://localhost:5434
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWD: ci-only-password-not-real-1234567890
          JWT_SECRET: ci-only-jwt-secret-not-real-1234567890abcd
          DB_ENCRYPTION_KEY: ci-only-enc-key-not-real-1234567890abcdef
          TSI_LOOKUP_SALT: ci-only-salt-not-real-1234567890abcdefgh
          TSI_DPDP_CMS_ENV: local
        run: |
          if [ -d tests ] || ls -1 **/test_*.py >/dev/null 2>&1; then
            pytest -q
          else
            echo "No tests yet - skipping. Add a tests/ directory to enable."
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f python_port/Dockerfile -t tsi-dpdp-cms-python:ci .
