name: Main

on:
  workflow_dispatch: {}
  push:
    branches: [p5_changes]
  pull_request:
    branches: [p5_changes]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check python_port

      - name: Ruff format check
        run: ruff format --check python_port
        continue-on-error: true # tighten on

  test:
    name: Import check + tests
    runs-on: ubuntu-latest
    # CI-only placeholder secrets. config.py refuses to load unless every one of
    # these is set (each secret at least 32 job level
    # where every step sees the same values.
    env:
      POSTGRES_HOST: postgresql://localhost:5434
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWD: ci-only-password-not-
      JWT_SECRET: ci-only-jwt-secret-not-real-1234567890abcd
      DB_ENCRYPTION_KEY: ci-only-enc-key-not
      TSI_LOOKUP_SALT: ci-only-salt-not-real-1234567890abcdefgh
      BOOTSTRAP_TOKEN: ci-only-bootstrap-tok
      TSI_DPDP_CMS_ENV: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_port/requirements.txt

      - name: Install dependencies
        run: pip install -r python_port/requirements.txt pytest

      # Catches syntax errors and bad import
      - name: Byte-compile sources
        run: python -m compileall -q python_port/dpdpcms_py

      - name: Import smoke test
        working-directory: python_port
        run: python -c "import dpdpcms_py.main"

      # `python -m pytest` puts python_port/rt
      # dpdpcms_py` works with or without pytest.ini. A missing or empty suite
      # fails the job (pytest exits 5)  instead of passing green.
      - name: Run pytest
        working-directory: python_port
        run: python -m pytest -q tests

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f python_port/Dockerfile -t tsi-dpdp-cms-python:ci .
