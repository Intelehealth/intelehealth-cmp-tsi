name: Main

on:
  workflow_dispatch: {}
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check python_port

      # Tighten once the codebase is formatted.
      - name: Ruff format check
        run: ruff format --check python_port
        continue-on-error: true

  test:
    name: Import check + tests
    runs-on: ubuntu-latest
    # CI-only placeholders. config.py needs all of
    # them; each secret must be 32+ characters.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password-0123456789abcdef
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: postgresql://localhost:5434
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWD: ci-password-0123456789abcdef
      JWT_SECRET: ci-jwt-0123456789abcdef0123456789abcdef
      DB_ENCRYPTION_KEY: ci-enc-0123456789abcdef0123456789abcdef
      TSI_LOOKUP_SALT: ci-salt-0123456789abcdef0123456789abcdef
      BOOTSTRAP_TOKEN: ci-boot-0123456789abcdef0123456789abcdef
      TSI_DPDP_CMS_ENV: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python_port/requirements.txt
            python_port/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r python_port/requirements-dev.txt

      # Import smoke test after the schema is ready.
      - name: Provision test database
        env:
          PGHOST: localhost
          PGPORT: "5434"
          PGDATABASE: ci
          PGUSER: ci
          PGPASSWORD: ci-password-0123456789abcdef
        run: |
          for f in db/*.sql; do
            echo "applying $f"
            psql -q -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Import smoke test
        working-directory: python_port
        run: python -c "import dpdpcms_py.main"

      # python -m pytest puts python_port/ on sys.path.
      # An empty suite fails (exit 5), never green. The DB-backed tests in
      # tests/test_integration_db.py run against the provisioned Postgres, so
      # scoping/ordering defects that the stubbed unit suite cannot see are
      # now caught in CI (the workbook's P6/P7 root-cause finding).
      - name: Run pytest
        working-directory: python_port
        run: python -m pytest -q tests

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: >-
          docker build -f python_port/Dockerfile
          -t tsi-dpdp-cms-python:ci .
