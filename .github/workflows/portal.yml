name: Developer portal

# Builds the Docusaurus portal (portal/) from the generated OpenAPI specs
# (docs/api/*.json) and publishes it to GitHub Pages.
#
# One-time repository setting: Settings > Pages > Source = "GitHub Actions".
# A pull request builds the site but does not publish it.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "docs/api/**"
      - ".github/workflows/portal.yml"
  pull_request:
    paths:
      - "portal/**"
      - "docs/api/**"
      - ".github/workflows/portal.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
